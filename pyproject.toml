[project]
name = "life-in-uk-test"
version = "1.0.0"
description = "Free Life in the UK test practice site: mock tests, topic drills and key facts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sahir Vhora"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
